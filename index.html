<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Madrid por descubrir</title>

    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            color: #333;
        }

        header {
            text-align: center;
            padding: 25px 15px 15px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            color: #666;
        }

        #map {
            width: 92%;
            max-width: 1000px;
            height: 650px;
            margin: 20px auto 40px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

        .codigo {
            margin-top: 20px;
            width: 100%;
            box-sizing: border-box;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 10px;
            font-size: 16px;
        }

        .boton {
            margin-top: 10px;
            padding: 12px 20px;
            border: none;
            border-radius: 20px;
            background: #333;
            color: white;
            cursor: pointer;
            font-size: 15px;
        }

        .mensaje {
            margin-top: 12px;
            font-weight: bold;
        }

    </style>
</head>

<body>

<header>

    <h1>Madrid por descubrir</h1>

    <p>Un mapa de planes para ti</p>

</header>


<div id="map"></div>


<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

    // -----------------------------------
    // MAPA
    // -----------------------------------

    const map = L.map('map').setView([40.4168, -3.7038], 12);


    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);



    // -----------------------------------
    // PLAN 1
    // -----------------------------------

    const punto1 = L.marker([40.4153, -3.6944])
        .addTo(map);


    punto1.bindPopup(`

        <h3>🎁 Primer plan</h3>

        <p>
            Aquí aparecerá el primer plan sorpresa.
        </p>

        <p>
            Cuando termines el plan encontrarás
            una palabra que te permitirá continuar.
        </p>

        <input
            id="codigo"
            class="codigo"
            type="text"
            placeholder="Introduce la palabra"
        >

        <button
            class="boton"
            onclick="comprobarCodigo()"
        >
            Desbloquear
        </button>

        <div
            id="mensaje"
            class="mensaje">
        </div>

    `);



    // -----------------------------------
    // COMPROBAR CÓDIGO
    // -----------------------------------

    function comprobarCodigo() {

        const campo =
            document.getElementById("codigo");

        const mensaje =
            document.getElementById("mensaje");


        const codigo =
            campo.value.trim().toLowerCase();


        // ESTE ES EL CÓDIGO DEL PLAN 1
        if (codigo === "diego") {

            localStorage.setItem(
                "plan2desbloqueado",
                "true"
            );


            mensaje.innerText =
                "🎉 ¡Has desbloqueado el siguiente plan!";


            crearPlan2();


        } else {

            mensaje.innerText =
                "❌ Esa no es la palabra correcta.";

        }

    }



    // -----------------------------------
    // PLAN 2
    // -----------------------------------

    function crearPlan2() {

        const punto2 =
            L.marker([40.4230, -3.7090])
            .addTo(map);


        punto2.bindPopup(`

            <h3>🎁 Segundo plan</h3>

            <p>
                ¡Has conseguido llegar hasta aquí!
            </p>

            <p>
                Aquí pondremos el segundo plan.
            </p>

        `);

    }



    // -----------------------------------
    // RECUPERAR PROGRESO
    // -----------------------------------

    if (
        localStorage.getItem("plan2desbloqueado")
        === "true"
    ) {

        crearPlan2();

    }

</script>

</body>
</html>
