<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Madrid por descubrir</title>

    <!-- Leaflet -->
    <link
        rel="stylesheet"
        href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    />

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f1e8;
            color: #333;
        }

        header {
            text-align: center;
            padding: 25px 15px 15px;
        }

        h1 {
            margin: 0 0 8px;
            font-size: 32px;
        }

        header p {
            margin: 0;
            color: #666;
        }

        #map {
            width: 92%;
            max-width: 1000px;
            height: 650px;
            margin: 20px auto 40px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 5px 20px rgba(0,0,0,0.15);
        }

    </style>
</head>

<body>

<header>

    <h1>Madrid por descubrir</h1>

    <p>Un mapa de planes para ti</p>

</header>


<div id="map"></div>


<!-- Leaflet -->

<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js">
</script>


<script>

    // Crear el mapa centrado en Madrid
    const map = L.map('map').setView([40.4168, -3.7038], 12);


    // Mapa de OpenStreetMap
    L.tileLayer(
        'https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',
        {
            attribution: '&copy; OpenStreetMap contributors'
        }
    ).addTo(map);


    // Nuestro primer punto de prueba
    const punto1 = L.marker([40.4153, -3.6944])
        .addTo(map);


    // Lo que aparece al pulsar el punto
    punto1.bindPopup(`
        <h3>🎁 Primer plan</h3>

        <p>
            Aquí aparecerá el primer plan sorpresa.
        </p>
    `);

</script>

</body>
</html>
