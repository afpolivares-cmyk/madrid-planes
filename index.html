function crearEtiqueta(
    lat,
    lng,
    texto,
    hecha,
    icono = "📍",
    final = false
) {

    const clase =
    final
    ? "icono-mapa final"
    : hecha
        ? "icono-mapa hecha"
        : "icono-mapa";


    return L.marker(
        [lat, lng],
        {
            icon: L.divIcon({

                className: "",

                html:
                    `<div class="${clase}">
                        ${icono}
                        ${hecha ? '<span class="check">✓</span>' : ""}
                    </div>`,

                iconSize: [42, 42],

                iconAnchor: [21, 21]

            })
        }
    ).addTo(map);

}

        Los jardines son de estilo neoclásico con

        <p>

        `

    },


    {

        lat: 40.42536,
        lng: -3.72560,

        titulo:
            "Ermita de San Antonio de la Florida. Martes a domingo de 9:30am a 8pm",

    {

        <p>

/* =========================================================
   MOSTRAR PLAN 6
========================================================= */

function mostrarPlan6() {
const iconos = ["🏛️", "🌹", "🎨", "🌿", "⛰️", "🌴"];
    
    lugaresPlan6.forEach((lugar, index) => {

        const hecha =
            estaHecho(lugar.id);


        const marcador =
            crearEtiqueta(
    lugar.lat,
    lugar.lng,
    lugar.titulo,
    hecha,
    iconos[index]
);


        marcador.bindPopup(`

        <div class="popup">

            <h2>
                ${lugar.titulo}
            </h2>

            ${lugar.texto}

            ${
                hecha

                ?

                `
                <div class="mensaje ok">
                    ✓ Lugar visitado
                </div>
                `

                :

                `
                <button
                    class="boton-hecho"
                    onclick="marcarVisitado('${lugar.id}')"
                >
                    ✓ Marcar como visitado
                </button>
                `
            }

        </div>

        `);

    });

}



/* =========================================================
   MARCAR LUGAR VISITADO
========================================================= */

function marcarVisitado(id) {

    guardar(id);

    comprobarFinPlan6();

    location.reload();

}



/* =========================================================
   COMPROBAR SI TERMINÓ PLAN 6
========================================================= */

function comprobarFinPlan6() {

    const todos =
        lugaresPlan6.every(
            lugar => estaHecho(lugar.id)
        );


    if (todos) {

        guardar("plan6");

    }

}



/* =========================================================
   SI PLAN 5 ESTÁ HECHO → MOSTRAR LOS 6 LUGARES
========================================================= */

if (estaHecho("plan5")) {

    mostrarPlan6();

}



/* =========================================================
   PLAN 7
========================================================= */

if (
    estaHecho("plan6")
) {

    const planFinal =
    crearEtiqueta(
        40.3590,
        -3.5490,
        "🍕 ¡ENHORABUENA!",
        false,
        "🍕",
        true
    );


    planFinal.bindPopup(`

    <div class="popup">

        <h2>
            ¡ENHORABUENA!<br>
            Completaste el regalo.
        </h2>

        <p>
            Debes estar cansada:
        </p>

        <p>
            Te invito a cenar
            <strong>Pecora Nera</strong>:
        </p>

        <p>
            <strong>TÚ ELIGES LAS PIZZAS</strong>
        </p>

    </div>

    `);

}



/* =========================================================
   AJUSTAR MAPA AL PROGRESO
========================================================= */

function ajustarVista() {

    if (estaHecho("plan6")) {

    map.setView(
        [40.3328, -3.5270],
        15,
        {
            animate: true,
            duration: 1.5
        }
    );

}

    else if (estaHecho("plan5")) {

        map.setView(
            [40.4168, -3.7038],
            12
        );

    }

    else {

    map.setView(
        [40.3328, -3.5270],
        14
    );

}

}


ajustarVista();


function abrirRegalo() {
    localStorage.setItem("regaloAbierto", "true");
    document.getElementById("portada").classList.add("oculta");
}
